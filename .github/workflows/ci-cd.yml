name: CI/CD — Warehouse Slot Analyzer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.13"
  APP_NAME: warehouse-analytics

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_warehouse.db
          SECRET_KEY: ci-test-secret-do-not-use-in-production
          APP_ENV: testing
        run: python -m pytest tests/ -v --tb=short

      - name: Clean up test DB
        run: rm -f test_warehouse.db

  # ── 2. Lint / Security Scan ──────────────────────────────────────────────────
  lint:
    name: Lint and Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install bandit

      - name: Security scan (bandit)
        run: bandit -r app/ -ll --skip B101

  # ── 3. Deploy to Azure App Service (main branch only) ────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Deploy to Azure Web App using publish profile
      # AZURE_WEBAPP_PUBLISH_PROFILE must be set in GitHub repository secrets.
      # To obtain it: Azure Portal → App Service → Download publish profile.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

      - name: Post-deploy health check
        run: |
          sleep 30
          curl -f https://${{ env.APP_NAME }}.azurewebsites.net/api/monitoring/health \
            || echo "Health check failed — app may need a moment to start."

# ── Required GitHub Secrets ────────────────────────────────────────────────────
# Set these in: Repository → Settings → Secrets and Variables → Actions
#
# AZURE_WEBAPP_PUBLISH_PROFILE  — Downloaded from Azure App Service
#
# The following are set as App Service Application Settings (not GitHub secrets):
# DATABASE_URL, SECRET_KEY, AZURE_STORAGE_CONNECTION_STRING, etc.
# See docs/AZURE_SETUP.md for full configuration guide.
